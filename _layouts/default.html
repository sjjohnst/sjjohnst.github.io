<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ page.title }}</title>
    {% include head.html %}
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fraunces requests the full opsz/wght ranges plus the SOFT and WONK
         axes driven by $display-variation in _sass/_variables.scss. -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-package/favicon-96x96.png">
    <link rel="icon" href="/assets/favicon-package/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="icon" href="/assets/favicon-package/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/favicon-package/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon-package/site.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  </head>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const burger = document.querySelector('.navbar-burger');
      const menu = document.querySelector('#navbarBasic');
  
      burger.addEventListener('click', () => {
        burger.classList.toggle('is-active');
        menu.classList.toggle('is-active');
      });
    });
  </script>
  <body>
    <!-- Animated topographic background (populated by assets/js/topo.js) -->
    {%- if page.url == "/" or page.permalink == "/" -%}
      <div id="topography-bg"></div>
    {%- endif -%}
    <!-- Navigation Bar -->
    <nav class="navbar is-light" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item" href="{{ site.baseurl }}/">
          <strong>Samuel Johnston</strong>
        </a>
    
        <!-- Hamburger menu for mobile -->
        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasic">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>
    
      <div id="navbarBasic" class="navbar-menu">
        <div class="navbar-start">
          <a class="navbar-item" href="{{ site.baseurl }}/projects">
            Projects
          </a>
          <a class="navbar-item" href="{{ site.baseurl }}/blog">
            Blog
          </a>
          <!-- Add more links as needed -->
        </div>
      </div>

      <div class="navbar-end">
        <div class="navbar-item">
          <div class="buttons">
            <a class="button is-light" href="mailto:johnston.samuelj@gmail.com" title="Email">
              <span class="icon">
                <i class="fas fa-envelope"></i>
              </span>
            </a>
            <a class="button is-light" href="https://linkedin.com/in/johnston-samuel" title="LinkedIn" target="_blank">
              <span class="icon">
                <i class="fab fa-linkedin"></i>
              </span>
            </a>
            <a class="button is-light" href="https://github.com/sjjohnst" title="GitHub" target="_blank">
              <span class="icon">
                <i class="fab fa-github"></i>
              </span>
            </a>
          </div>
        </div>
      </div>
    </nav>
    <!-- Content -->
    <main class="page-main">
      {%- if page.full_bleed -%}
        {{ content }}
      {%- else -%}
        <section class="section">
          <div class="container">
            {{ content }}
          </div>
        </section>
      {%- endif -%}
    </main>
    {%- comment -%} <!-- Watermark -->
    <div class="watermark">&copy; {{ 'now' | date: '%Y' }} Samuel Johnston</div> {%- endcomment -%}
  </body>
</html>
