<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ page.title }}</title>
    {% include head.html %}
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fraunces requests the full opsz/wght ranges plus the SOFT and WONK
         axes driven by $display-variation in _sass/_variables.scss. -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-package/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-package/favicon-16x16.png">
    <link rel="icon" href="/assets/favicon-package/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/favicon-package/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon-package/site.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  </head>
  <body>
    <!-- Animated topographic background (populated by assets/js/topo.js) -->
    {%- if page.url == "/" or page.permalink == "/" -%}
      <div id="topography-bg"></div>
    {%- endif -%}
    <!-- Navigation Bar -->
    {% include navbar.html %}
    <!-- Content -->
    <main class="page-main">
      {%- if page.full_bleed -%}
        {{ content }}
      {%- else -%}
        <section class="section">
          <div class="container">
            {{ content }}
          </div>
        </section>
      {%- endif -%}
    </main>
    {%- comment -%} <!-- Watermark -->
    <div class="watermark">&copy; {{ 'now' | date: '%Y' }} Samuel Johnston</div> {%- endcomment -%}
  </body>
</html>
